name: dat-parkinson
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - numpy<2.3       # nibabel 5.4.2 crashes (native access violation, no
                     # traceback) constructing Nifti1Image under numpy>=2.5;
                     # verified 2.2.6 works. Re-check if nibabel is upgraded.
  - libblas=*=*openblas  # forces OpenBLAS instead of MKL. This env had both
                     # MKL and libgomp (GNU OpenMP) DLLs loaded at once --
                     # any BLAS call (even a bare 4x4 matmul) crashed
                     # natively. OpenBLAS avoids the runtime clash entirely.
  - pandas
  - scipy
  - scikit-learn
  - matplotlib
  - nibabel
  - scikit-image  # rung-4 experiment 5 (NL-means denoising, RESOURCES.md's
                  # Boulkrinat et al. 2025) -- confirmed present in the
                  # DrivenData runtime's pyproject.toml, checked 2026-09-09
  - tqdm
  - pytest
  - jupyterlab
  - ipykernel
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch==2.14.0+cu126
      - torchvision==0.29.0+cu126
